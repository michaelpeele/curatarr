# nginx config for the Curatarr web container.
# - Serves the built SPA from /usr/share/nginx/html
# - Proxies /api/* and /hubs/* to the API container (service "curatarr-api" in docker-compose)
# - WebSocket upgrade for SignalR (/hubs/*)
# - try_files -> index.html so client-side routes (accept-invite, reset-password,
#   confirm-email-change) work on hard refresh instead of 404ing

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets from vite build; index.html is non-hashed so it stays fresh
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static files (logo.svg, favicon, etc.) — serve directly if they exist
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — reverse proxy to the API container
    location /api/ {
        proxy_pass http://curatarr-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub — needs WebSocket upgrade support
    location /hubs/ {
        proxy_pass http://curatarr-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}